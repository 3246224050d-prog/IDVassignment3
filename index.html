<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>D3.js 平行四边形向量图</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    .tooltip {
      position: absolute;
      pointer-events: none;
      padding: 4px 8px;
      font-size: 12px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }
  </style>
</head>
<body>
<div id="chart"></div>
<div id="tooltip" class="tooltip"></div>

<script>
// ---------------- 参数定义 ----------------
const cols = 10;
const rows = 5;
const cellSize = 60;
const margin = { top: 40, right: 60, bottom: 100, left: 60 };

const width  = cols * cellSize + margin.left + margin.right;
const height = rows * cellSize + margin.top + margin.bottom;

const svg = d3.select("#chart")
  .append("svg")
  .attr("width", width)
  .attr("height", height);

// 网格辅助线
function xScale(x) { return margin.left + x * cellSize; }
function yScale(y) { return margin.top + (rows - y) * cellSize; }

for (let i = 0; i <= cols; i++) {
  svg.append("line")
    .attr("x1", xScale(i))
    .attr("y1", margin.top)
    .attr("x2", xScale(i))
    .attr("y2", margin.top + rows * cellSize)
    .attr("stroke", "#eee");
}
for (let j = 0; j <= rows; j++) {
  const y = margin.top + j * cellSize;
  svg.append("line")
    .attr("x1", margin.left)
    .attr("y1", y)
    .attr("x2", margin.left + cols * cellSize)
    .attr("y2", y)
    .attr("stroke", "#eee");
}

// ---------------- 坐标定义 ----------------
// 定义成平行四边形顶点
const pts = {
  e1a: { x: 8, y: 4 },   // e₁^α
  e2a: { x: 4, y: 4 },   // e₂^α
  e1b: { x: 6, y: 1 },   // e₁^β
  e2b: { x: 2, y: 1 }    // e₂^β
};

// ---------------- 绘制平行四边形 ----------------
const parallelogram = [
  [pts.e2b, pts.e1b],
  [pts.e1b, pts.e1a],
  [pts.e1a, pts.e2a],
  [pts.e2a, pts.e2b]
];

// 加箭头
const defs = svg.append("defs");
defs.append("marker")
  .attr("id", "arrow")
  .attr("viewBox", "0 -5 10 10")
  .attr("refX", 10)
  .attr("refY", 0)
  .attr("markerWidth", 6)
  .attr("markerHeight", 6)
  .attr("orient", "auto")
  .append("path")
  .attr("d", "M0,-5L10,0L0,5")
  .attr("fill", "#333");

// 绘制平行四边形边
svg.selectAll(".side")
  .data(parallelogram)
  .enter()
  .append("line")
  .attr("x1", d => xScale(d[0].x))
  .attr("y1", d => yScale(d[0].y))
  .attr("x2", d => xScale(d[0].x))
  .attr("y2", d => yScale(d[0].y))
  .attr("stroke", "#333")
  .attr("stroke-width", 2)
  .attr("marker-end", "url(#arrow)")
  .transition()
  .duration(1200)
  .delay((d, i) => i * 250)
  .attr("x2", d => xScale(d[1].x))
  .attr("y2", d => yScale(d[1].y));

// ---------------- 绘制虚线对角 ----------------
svg.append("line")
  .attr("x1", xScale(pts.e2b.x))
  .attr("y1", yScale(pts.e2b.y))
  .attr("x2", xScale(pts.e2b.x))
  .attr("y2", yScale(pts.e2b.y))
  .attr("stroke", "#2c6db3")
  .attr("stroke-width", 2)
  .attr("stroke-dasharray", "6,4")
  .attr("marker-end", "url(#arrow)")
  .transition()
  .duration(1000)
  .delay(1000)
  .attr("x2", xScale(pts.e1a.x))
  .attr("y2", yScale(pts.e1a.y));

svg.append("line")
  .attr("x1", xScale(pts.e2a.x))
  .attr("y1", yScale(pts.e2a.y))
  .attr("x2", xScale(pts.e2a.x))
  .attr("y2", yScale(pts.e2a.y))
  .attr("stroke", "#6baed6")
  .attr("stroke-width", 2)
  .attr("stroke-dasharray", "6,4")
  .attr("marker-end", "url(#arrow)")
  .transition()
  .duration(1000)
  .delay(1300)
  .attr("x2", xScale(pts.e1b.x))
  .attr("y2", yScale(pts.e1b.y));

// ---------------- 绘制标签 ----------------
function drawLabel(p, alphaOrBeta, index, offsetX, offsetY) {
  const tx = xScale(p.x) + (offsetX || 0);
  const ty = yScale(p.y) + (offsetY || 0);
  const text = svg.append("text")
    .attr("x", tx)
    .attr("y", ty)
    .attr("font-family", "Times New Roman")
    .attr("font-style", "italic")
    .attr("font-weight", "bold")
    .attr("font-size", 24)
    .attr("fill", "#000000")
    .style("opacity", 0);
  text.text("e");
  text.append("tspan")
    .attr("baseline-shift", "super")
    .attr("font-size", "60%")
    .text(alphaOrBeta);
  text.append("tspan")
    .attr("baseline-shift", "sub")
    .attr("font-size", "60%")
    .text(index);
  text.transition().delay(800).duration(600).style("opacity", 1);
}

drawLabel(pts.e1a, "α", "1",  15, -15);
drawLabel(pts.e2a, "α", "2", -20, -15);
drawLabel(pts.e1b, "β", "1",  15,  25);
drawLabel(pts.e2b, "β", "2", -20,  25);

// ---------------- 中点交叉点 ----------------
const intersection = { x: (pts.e1a.x + pts.e2b.x)/2, y: (pts.e1a.y + pts.e2b.y)/2 };
svg.append("circle")
  .attr("cx", xScale(intersection.x))
  .attr("cy", yScale(intersection.y))
  .attr("r", 0)
  .attr("fill", "#333")
  .transition()
  .delay(2200)
  .duration(400)
  .attr("r", 4);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>D3.js 左右图（position 在 x=1 上方）</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: "Helvetica Neue", Arial, sans-serif; }
    .axis-label { font-size: 14px; font-style: italic; }
  </style>
</head>
<body>
<div id="chart"></div>

<script>
// 整体 SVG 尺寸
const width  = 1150;
const height = 360;

const svg = d3.select("#chart")
  .append("svg")
  .attr("width", width)
  .attr("height", height);

// 紫色箭头定义
const defs = svg.append("defs");
defs.append("marker")
  .attr("id", "arrowHeadPurple")
  .attr("viewBox", "0 -5 10 10")
  .attr("refX", 10)
  .attr("refY", 0)
  .attr("markerWidth", 5)
  .attr("markerHeight", 5)
  .attr("orient", "auto")
  .append("path")
  .attr("d", "M0,-5L10,0L0,5")
  .attr("fill", "#5b3a8c");

// -----------------------------------------------------
// 左图：加宽 + 交互
// -----------------------------------------------------
const leftMargin = { top: 40, right: 20, bottom: 80, left: 110 };
const leftWidth  = 450;
const leftHeight = 240;

const gLeft = svg.append("g")
  .attr("transform", `translate(${leftMargin.left},${leftMargin.top})`);

const xL = d3.scaleLinear().domain([0, 1]).range([0, leftWidth]);
const yL = d3.scaleLinear().domain([0, 1]).range([leftHeight, 0]);

// 坐标轴
gLeft.append("line")
  .attr("x1", xL(0))
  .attr("y1", yL(0))
  .attr("x2", xL(0))
  .attr("y2", yL(1.05))
  .attr("stroke", "#000")
  .attr("stroke-width", 3)
  .attr("marker-end", "url(#arrowHeadPurple)");

gLeft.append("line")
  .attr("x1", xL(0))
  .attr("y1", yL(0))
  .attr("x2", xL(1.05))
  .attr("y2", yL(0))
  .attr("stroke", "#000")
  .attr("stroke-width", 3)
  .attr("marker-end", "url(#arrowHeadPurple)");

// 参数
const lowP1Height   = 0.18;
const barTop        = 0.7;
const iOverN        = 0.22;
const iPlusDeltaN   = 0.36;
const targetStart   = 0.55;
const targetEnd     = 0.69;

// p1 底部矩形
gLeft.append("rect")
  .attr("x", xL(0))
  .attr("y", yL(lowP1Height))
  .attr("width", xL(1) - xL(0))
  .attr("height", yL(0) - yL(lowP1Height))
  .attr("fill", "#e2d8f5");

// 高柱 p2
const barWidth = xL(iPlusDeltaN) - xL(iOverN);
const highBar = gLeft.append("rect")
  .attr("x", xL(iOverN))
  .attr("y", yL(lowP1Height))
  .attr("width", barWidth)
  .attr("height", 0)
  .attr("fill", "#c1aee8")
  .attr("stroke", "#5b3a8c")
  .attr("stroke-dasharray", "4,2")
  .style("cursor", "pointer");

highBar.transition()
  .duration(800)
  .attr("y", yL(barTop))
  .attr("height", yL(lowP1Height) - yL(barTop));

highBar
  .on("mouseover", function () {
    d3.select(this).transition().duration(200).attr("fill", "#b296e4");
  })
  .on("mouseout", function () {
    d3.select(this).transition().duration(200).attr("fill", "#c1aee8");
  });

// 右侧虚框
gLeft.append("rect")
  .attr("x", xL(targetStart))
  .attr("y", yL(barTop))
  .attr("width", xL(targetEnd) - xL(targetStart))
  .attr("height", yL(lowP1Height) - yL(barTop))
  .attr("fill", "none")
  .attr("stroke", "#5b3a8c")
  .attr("stroke-dasharray", "5,4");

// 紫色箭头
gLeft.append("line")
  .attr("x1", xL(iPlusDeltaN) + 8)
  .attr("y1", yL(0.45))
  .attr("x2", xL(targetStart) - 8)
  .attr("y2", yL(0.45))
  .attr("stroke", "#5b3a8c")
  .attr("stroke-width", 2)
  .attr("marker-end", "url(#arrowHeadPurple)");

// y 轴节点和标签
const yTicks = [
  { y: lowP1Height, label: "p₁ (Low)" },
  { y: barTop,      label: "p₂ (High)" }
];

const yNodes = gLeft.selectAll(".yTickNode")
  .data(yTicks)
  .enter()
  .append("circle")
  .attr("class", "yTickNode")
  .attr("cx", xL(0))
  .attr("cy", d => yL(d.y))
  .attr("r", 3)
  .attr("fill", "#000");

gLeft.selectAll(".yTickLabel")
  .data(yTicks)
  .enter()
  .append("text")
  .attr("x", xL(-0.08))
  .attr("y", d => yL(d.y) + 4)
  .attr("text-anchor", "end")
  .attr("class", "axis-label")
  .text(d => d.label);

yNodes
  .style("cursor", "pointer")
  .on("mouseover", function () {
    d3.select(this).transition().duration(150).attr("r", 5);
  })
  .on("mouseout", function () {
    d3.select(this).transition().duration(150).attr("r", 3);
  });

// x 轴节点和标签
const xTicks = [
  { x: 0,           label: "0" },
  { x: iOverN,      label: "i / n" },
  { x: iPlusDeltaN, label: "(i + Δn) / n" },
  { x: 1,           label: "1" }
];

const xNodes = gLeft.selectAll(".xTickNode")
  .data(xTicks)
  .enter()
  .append("circle")
  .attr("class", "xTickNode")
  .attr("cx", d => xL(d.x))
  .attr("cy", yL(0))
  .attr("r", 3)
  .attr("fill", "#000");

gLeft.selectAll(".xTickLabel")
  .data(xTicks)
  .enter()
  .append("text")
  .attr("x", d => xL(d.x))
  .attr("y", yL(0) + 25)
  .attr("text-anchor", "middle")
  .attr("font-style", "italic")
  .text(d => d.label);

xNodes
  .style("cursor", "pointer")
  .on("mouseover", function () {
    d3.select(this).transition().duration(150).attr("r", 5);
  })
  .on("mouseout", function () {
    d3.select(this).transition().duration(150).attr("r", 3);
  });

// -----------------------------------------------------
// 右图：position 移到 x=1 上方
// -----------------------------------------------------
const rightMargin = { top: 40, right: 40, bottom: 80, left: 70 };
const rightWidth  = 380;
const rightHeight = 240;

const gRight = svg.append("g")
  .attr("transform", `translate(${width - rightWidth - rightMargin.right},${rightMargin.top})`);

const xR = d3.scaleLinear().domain([0, 1]).range([0, rightWidth]);
const yR = d3.scaleLinear().domain([0, 50]).range([rightHeight, 0]);

const yAxisX = xR(0) - 20;
const xAxisY = yR(0) + 20;

// y 轴
gRight.append("line")
  .attr("x1", yAxisX)
  .attr("y1", yR(0))
  .attr("x2", yAxisX)
  .attr("y2", yR(50))
  .attr("stroke", "#000")
  .attr("stroke-width", 3);

// x 轴
gRight.append("line")
  .attr("x1", xR(0))
  .attr("y1", xAxisY)
  .attr("x2", xR(1))
  .attr("y2", xAxisY)
  .attr("stroke", "#000")
  .attr("stroke-width", 3);

// y 轴刻度
[0, 20, 40].forEach(v => {
  gRight.append("line")
    .attr("x1", yAxisX)
    .attr("y1", yR(v))
    .attr("x2", yAxisX + 6)
    .attr("y2", yR(v))
    .attr("stroke", "#000")
    .attr("stroke-width", 2);
  if (v !== 0) {
    gRight.append("text")
      .attr("x", yAxisX - 8)
      .attr("y", yR(v) + 4)
      .attr("text-anchor", "end")
      .attr("font-size", 12)
      .text(v);
  }
});

// x 轴刻度
[0, 0.5, 1].forEach(v => {
  gRight.append("line")
    .attr("x1", xR(v))
    .attr("y1", xAxisY - 6)
    .attr("x2", xR(v))
    .attr("y2", xAxisY)
    .attr("stroke", "#000")
    .attr("stroke-width", 2);
  gRight.append("text")
    .attr("x", xR(v))
    .attr("y", xAxisY + 18)
    .attr("text-anchor", "middle")
    .attr("font-size", 12)
    .text(v);
});

// ✅ 把 position 放到 x=1 上方
gRight.append("text")
  .attr("x", xR(1))           // 关键：对齐 x=1 刻度
  .attr("y", xAxisY - 30)
  .attr("text-anchor", "middle")
  .attr("font-size", 16)
  .attr("font-style", "italic")
  .text("position");

// 曲线数据
const xVals = [0.1, 0.3, 0.5, 0.7, 0.9];
const dataSolid = xVals.map(x => ({ x, y: 35 - 10 * x * x }));
const dataDashed = xVals.map(x => ({ x, y: 47 - 6 * x }));

const lineGen = d3.line()
  .x(d => xR(d.x))
  .y(d => yR(d.y))
  .curve(d3.curveMonotoneX);

// 虚线
gRight.append("path")
  .datum(dataDashed)
  .attr("d", lineGen)
  .attr("fill", "none")
  .attr("stroke", "#cfded1")
  .attr("stroke-width", 3)
  .attr("stroke-dasharray", "6,4")
  .attr("opacity", 0.7);

// 绿线
const solidPath = gRight.append("path")
  .datum(dataSolid)
  .attr("d", lineGen)
  .attr("fill", "none")
  .attr("stroke", "#4daf4a")
  .attr("stroke-width", 3)
  .style("cursor", "pointer");

const totalLength = solidPath.node().getTotalLength();
solidPath
  .attr("stroke-dasharray", totalLength + " " + totalLength)
  .attr("stroke-dashoffset", totalLength)
  .transition()
  .duration(1500)
  .ease(d3.easeLinear)
  .attr("stroke-dashoffset", 0);

solidPath
  .on("mouseover", function () {
    d3.select(this).transition().duration(200).attr("stroke-width", 5);
  })
  .on("mouseout", function () {
    d3.select(this).transition().duration(200).attr("stroke-width", 3);
  });
</script>
</body>
</html>
